name: F1 데이터 자동 갱신

on:
  schedule:
    # 2시간마다 깨어나지만, 실제로 받아올지는 스크립트가 일정을 보고 판단한다.
    #   레이스 주간(결승 -4일 ~ +2일) → 매번 받아옴
    #   그 외                        → 48시간에 한 번만
    #   내용이 안 바뀌면 커밋도 안 함
    - cron: '13 */2 * * *'
  workflow_dispatch:        # Actions 탭에서 수동 실행 — 항상 강제로 받아옴
  push:                     # 수집기나 설정을 바꿔 올렸을 때 바로 한 번
    paths:
      - 'tools/fetch_f1.py'
      - '.github/workflows/update-f1-data.yml'

permissions:
  contents: write

concurrency:
  group: f1-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 데이터 수집
        env:
          EV: ${{ github.event_name }}
        run: |
          if [ "$EV" = "schedule" ]; then
            python tools/fetch_f1.py --out data/live.json
          else
            python tools/fetch_f1.py --out data/live.json --force
          fi

      - name: 바뀐 게 있으면 커밋
        run: |
          git config user.name  "pitwall-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live.json
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "data: F1 자동 갱신 $(date -u '+%Y-%m-%d %H:%M')"
            git push
          fi
