name: F1 데이터 자동 갱신

on:
  schedule:
    # 매일 04:17 UTC = 한국시각 13:17. 경기 다음 날 점심쯤 반영된다.
    - cron: '17 4 * * *'
  workflow_dispatch:        # 저장소 Actions 탭에서 수동 실행도 가능
  push:                     # 처음 올렸을 때 한 번 바로 돌도록
    paths:
      - 'tools/fetch_f1.py'
      - '.github/workflows/update-f1-data.yml'

permissions:
  contents: write

concurrency:
  group: f1-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 데이터 수집
        run: python tools/fetch_f1.py --out data/live.json

      - name: 바뀐 게 있으면 커밋
        run: |
          git config user.name  "pitwall-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live.json
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "data: F1 자동 갱신 $(date -u +%Y-%m-%d)"
            git push
          fi
